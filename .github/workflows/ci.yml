name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hook tests
        run: node --test "tests/*.test.mjs"
      - name: Manifests parse
        run: |
          for f in .claude-plugin/*.json templates/.claude/settings.json templates/.cursor/hooks.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"
          done
